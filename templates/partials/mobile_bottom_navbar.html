<style>
    .no-scrollbar::-webkit-scrollbar {
        display: none;
    }
    .no-scrollbar {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
    }
</style>

<nav class="fixed bottom-0 left-0 z-50 w-full h-19 bg-white border-t border-gray-200 shadow-[0_-2px_10px_rgba(0,0,0,0.05)] sm:hidden">
    <div id="mobile-nav-scroll" class="flex items-center h-full px-4 overflow-x-auto no-scrollbar gap-6">

        <a href="{% url 'core:home' %}" class="flex flex-col items-center justify-center min-w-14 text-gray-500 hover:text-green-600 transition-colors">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
            </svg>
            <span class="text-[11px] font-medium whitespace-nowrap">Home</span>
        </a>

        <a href="{% url 'orders:order_page' %}" class="shrink-0 flex items-center justify-center px-4 py-2 bg-green-600 text-white rounded-lg font-semibold shadow-md hover:bg-green-700 active:scale-95 transition-all">
            <svg class="w-5 h-5 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
            </svg>
            <span class="text-sm whitespace-nowrap">Order Products</span>
        </a>

        <a href="{% url 'core:about' %}" class="flex flex-col items-center justify-center min-w-14 text-gray-500 hover:text-green-600 transition-colors">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span class="text-[11px] font-medium whitespace-nowrap">About Us</span>
        </a>

        <a href="{% url 'core:contacts' %}" class="flex flex-col items-center justify-center min-w-16 text-gray-500 hover:text-green-600 transition-colors">
            <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.211L7.13 11.042a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
            </svg>
            <span class="text-[11px] font-medium whitespace-nowrap">Contact Us</span>
        </a>
    </div>
</nav>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const currentPath = window.location.pathname.replace(/\/$/, "") || "/";
        const scrollContainer = document.getElementById('mobile-nav-scroll');
        if (!scrollContainer) return;

        const links = scrollContainer.querySelectorAll('a');

        links.forEach(link => {
            // Skip the order button style modifications entirely
            if (link.classList.contains('bg-green-600')) return;

            // Give elements full heights and bottom border setup safely
            link.classList.add('border-b-2', 'h-full');

            const linkPath = link.pathname.replace(/\/$/, "") || "/";

            if (linkPath === currentPath) {
                // 1. Underline ONLY the exact matching active link
                link.classList.remove('text-gray-500', 'border-transparent');
                link.classList.add('text-green-600', 'border-green-600');
                
                // 2. SMART SCROLL: 'inline: auto' ensures if it's already visible (like Contact),
                // it stays exactly where it is. If it's hidden out of view (like Tips), it scrolls right.
                link.scrollIntoView({ behavior: 'instant', block: 'nearest', inline: 'auto' });
            } else {
                // 3. Force turn off underline and green text for all non-active elements
                link.classList.remove('text-green-600', 'border-green-600');
                link.classList.add('text-gray-500', 'border-transparent');
            }
        });
    });
</script>
